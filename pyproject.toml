[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox-lending-mcp-server"
version = "1.0.0"
description = "Beginner-friendly MCP server for the household toolbox: inventory, lend-a-tool ledger, maintenance nudges, project gap lists, and seasonal tune-ups."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["mcp", "model-context-protocol", "toolbox", "lending", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
toolbox-mcp-server = "toolbox_mcp.server:main"

[tool.setuptools.packages.find]
include = ["toolbox_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
